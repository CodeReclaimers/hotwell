[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expression
build-backend = "setuptools.build_meta"

[project]
name = "hotwell"
version = "0.4.0"
description = "Headless reduced-order steam plant simulation core"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alan McIntyre" }]
dependencies = [
    "numpy",
    "scipy",
    "pyyaml",
]

[project.urls]
Repository = "https://github.com/CodeReclaimers/hotwell"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "matplotlib",  # scripts only — never imported by the hotwell package
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Baseline config, protection table, and canonical scenarios ship inside the
# package (0.2.0) so hotwell runs from any cwd with no repo checkout present.
"hotwell.data" = ["*.yaml", "scenarios/*.yaml", "procedures/*.yaml"]  # procedures: 0.4.0 M6

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 0.4.0 M4: the 24-h quiet-day acceptance runs take minutes each and are
# excluded from the default gate. Run them with: pytest -m slow -s
markers = ["slow: long-running acceptance runs (excluded by default; pytest -m slow)"]
addopts = "-m 'not slow'"
