[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotwell"
version = "0.3.0"
description = "Headless reduced-order steam plant simulation core"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "matplotlib",  # scripts only — never imported by the hotwell package
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Baseline config, protection table, and canonical scenarios ship inside the
# package (0.2.0) so hotwell runs from any cwd with no repo checkout present.
"hotwell.data" = ["*.yaml", "scenarios/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
