# Canonical scenario 1: +10% of rated load stepped onto the non-vital block.
# Expect droop response (f settles ~0.28 Hz low), drum transients damp out,
# no alarms beyond (at most) transient frequency-low.
name: load_step
seed: 42
init: {load_mw: 60, mode: islanded}
events:
  # non-vital block: 48 MW -> 54 MW (+10% of 60 MW rated)
  - {t: 300.0, type: set_load, target: nonvital, p0: 54.0e+6}
end: {max_t: 900}
