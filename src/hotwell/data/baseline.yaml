# hotwell baseline plant parameters. ALL VALUES SI unless noted.
# (PyYAML float gotcha: exponents must carry a sign — 8.0e+6, not 8e6.)

design:
  p_drum: 8.0e+6          # Pa — nominal drum pressure
  p_rated: 60.0e+6        # W — rated electrical output
  f0: 60.0                # Hz

drum:
  model: two_state        # two_state | astrom_bell (M4)
  two_state:
    v_total: 28.0         # m3 — drum+riser fluid volume
    v_liq_nwl: 14.0       # m3 — liquid volume at normal water level
    a_waterplane: 16.0    # m2 — effective waterplane (vertical-cylinder equiv.)
    p_min: 3.2e+6         # Pa — closure clamp (property-fit range guard)
    p_max: 11.8e+6        # Pa
  astrom_bell:            # Astrom & Bell (Automatica 36, 2000) P16-G16 table
    # scale = our rated drum steam draw / paper plant's est. full-load steam
    # flow = 87.12 / 90 (Q~180 MW at hs-hf~2.0 MJ/kg, paper Fig 3) — see HANDOFF
    scale: 0.968
    v_d: 40.0             # m3 (paper section 5.1, pre-scale)
    v_r: 37.0             # m3
    v_dc: 11.0            # m3
    a_d: 20.0             # m2 — drum wet area at operating level
    m_t: 300.0e+3         # kg — total metal mass
    m_r: 160.0e+3         # kg — riser metal mass
    m_d: 100.0e+3         # kg — drum metal (inferred: m_t - m_r = 140 t for
                          #      drum+downcomers; most is drum shell — HANDOFF)
    cp_metal: 550.0       # J/(kg*K) — consistent with paper Table 2 (~1410 J/Pa
                          #      for m_t*Cp*dts/dp at 8.5 MPa, within 3%)
    k_friction: 25.0      # [-] (paper value)
    a_dc: 0.2774          # m2 — calibrated so q_dc ~ 1300 kg/s at our design
                          #      point (alpha_r ~ 0.106, paper high-load range)
    beta: 0.3             # [-] (paper value)
    t_d: 12.0             # s — steam residence time in drum (paper value)
    vsd_nom: 4.8          # m3 — nominal steam volume under level (paper Fig 4
                          #      shows ~5 m3 at medium load), pre-scale

turbine:
  # k_t = P_rated/(x_rated * w_design * p_drum) so the droop law, rated flow,
  # and rated power are exactly consistent: 76.923 kg/s at x=0.85, 8 MPa.
  k_t: 1.131221719457014e-5   # kg/(s*Pa)
  # 0.4.0: specific work is eta_t * isentropic drop (p_drum -> p_cond); eta_t
  # is derived so w = w_design exactly at the design state (8 MPa, the
  # condenser model's pressure at rated exhaust = 7.0 kPa).
  w_design: 780.0e+3      # J/kg
  tau_chest: 0.4          # s
  x_rated: 0.85           # throttle position at rated flow/pressure

rotor:
  s_rating: 75.0e+6       # VA
  h_inertia: 4.0          # s
  d_m: 100.0              # N*m*s/rad — small mechanical damping
  f0: 60.0                # Hz

condenser:
  p0: 5.5e+3              # Pa — condenser pressure at zero exhaust
  p_load_slope: 1.5e+3    # Pa — added at rated exhaust (7 kPa total at rated)
  m_exh_rated: 76.923     # kg/s
  a_hotwell: 8.0          # m2
  hw_level_nominal: 1.0   # m above hotwell bottom (>= 45 s of rated condensate in band)
  z_hw: 3.0               # m — hotwell bottom above CP suction

deaerator:
  p_da: 0.15e+6           # Pa — fixed operating pressure (Tsat ~ 111.4 degC)
  area: 3.0               # m2
  level_nominal: 2.5      # m above tank bottom (~79 s of rated feed to low-suction)
  z_da: 11.0              # m — tank bottom above FP suction

loads:
  vital_p0: 12.0e+6       # W at rated (placeholder; init sets blocks to load_mw
  nonvital_p0: 48.0e+6    # W   minus station service — see initialize_steady_state)
  k_pf: 1.5               # frequency dependence
  vital_fraction: 0.2
  # 0.4.0 (plan M4): load process noise per block, an OU deviation from the
  # schedule: {sigma_w [W], tau [s] > 0}. Empty = none. Example:
  #   noise:
  #     nonvital: {sigma_w: 3.0e+5, tau: 120.0}
  noise: {}

firing:
  eta_comb: 0.89          # combustion efficiency
  q_fuel_max: 280.0e+6    # W fuel heat at firing.x = 1 (249.2 MW effective max)

actuators:
  fw_valve: {tau: 2.0, rate: 0.2}    # s, 1/s
  throttle: {tau: 1.0, rate: 1.0}
  firing:   {tau: 5.0, rate: 0.1}

pumps:
  condensate:             # 2 x 100%: CP-1, CP-2
    q_rated: 0.0775       # m3/s (~77 kg/s at 39 degC)
    h0: 50.0              # m shutoff head at s=1 (1.25 x rated head 40.2 m)
    k: 1631.0             # m/(m3/s)^2
    tau: 3.0              # s spin-up/coast-down
    npsh_a: 2.0           # m NPSH required at zero flow
    npsh_b: 133.0         # m/(m3/s)^2
    k_suction: 33.0       # m/(m3/s)^2 individual suction line friction
    i_rated: 60.0         # A motor current proxy at rated hydraulic power
    p_motor_rated: 40.0e+3  # W motor draw at rated hydraulics (30.3 kW hyd,
                            #   eta ~0.76); station-service load on the bus
  feed:                   # 2 x 100%: FP-1, FP-2
    q_rated: 0.0916       # m3/s (~87 kg/s at 111 degC, service rated)
    # pump's own rated point is 0.110 m3/s (20% flow margin over service);
    # shutoff = 1.25 x head at own rated => flat enough that the canonical
    # load step (+10% when sized; +6.83 MW since 0.3.0) does not starve the
    # drum with the FRV wide open.
    h0: 1117.0            # m shutoff
    k: 18462.0            # m/(m3/s)^2  (H(0.0916) = 962 m)
    tau: 4.0              # s
    npsh_a: 9.8           # m — deliberately flat curve: NPSH_req ~ 10.3 m at rated,
    npsh_b: 59.6          #     so DA drain-down erodes margin through the 0.5 m trip
    k_suction: 59.6       # m/(m3/s)^2 (0.5 m at rated)
    i_rated: 400.0        # A
    p_motor_rated: 1.0e+6   # W motor draw at rated hydraulics (821 kW hyd,
                            #   eta ~0.82); station-service load on the bus

network:
  z_da_inlet: 14.0        # m — DA condensate inlet above CP suction
  z_drum_inlet: 8.0       # m — drum feed inlet above FP suction
  k_line_cond: 6.4826e+6  # Pa/(m3/s)^2 (4 m head at rated condensate flow)
  k_line_feed: 5.5552e+6  # Pa/(m3/s)^2 (5 m head at rated feed flow)
  cv_lcv: 0.38295         # kg/(s*Pa^0.5) — DA level control valve (x~0.6 at rated)
  cv_frv: 0.1495          # kg/(s*Pa^0.5) — feed reg valve (x~0.55 at rated,
                          # ~120 kg/s capacity at x=1 with the flat pump)

sensors:
  # 0.4.0 (plan M3): per-instrument measurement noise, instrument units.
  # {sigma: stationary std, tau: AR(1) correlation time [s], 0 = white}.
  # Empty = no noise (bit-identical to 0.3-style sensing). Example:
  #   noise:
  #     drum_level: {sigma: 0.002, tau: 0.0}
  #     feed_flow:  {sigma: 0.3,   tau: 2.0}
  noise: {}

makeup:
  # 0.4.0 M5b: condensate storage tank (CST) -> makeup valve -> condenser.
  # Vacuum drag-in: dp = p_atm + rho*g*z_cst - p_cond. Cv is DERIVED so the
  # valve passes capacity_design wide open at the design condenser pressure.
  p_atm: 101325.0         # Pa
  z_cst: 5.0              # m, CST level above the condenser makeup inlet
  t_cst: 303.15           # K, makeup water temperature (30 degC)
  capacity_design: 10.0   # kg/s wide open at design p_cond

safety_valve:
  p_open: 8.6e+6          # Pa
  p_reseat: 8.3e+6        # Pa
  c_sv: 1.0744e-5         # kg/(s*Pa) — ~92 kg/s at 8.6 MPa (>= 1.2 x rated steam)

audit:
  piping_holdup: 2000.0   # kg — fixed piping/line inventory constant

control:
  governor:
    droop: 0.05           # R
  drum_level:             # PV: sensed drum level [m]; output: fw valve cmd
    kp: 3.0
    ki: 0.05
    lo: 0.0
    hi: 1.0
    t_track: 15.0
    three_element: false  # M4 option: steam-flow feedforward + feed-flow trim
  drum_level_3e:          # gains used only when three_element: true
    trim:                 # PV: sensed drum level [m]; output: flow trim [kg/s]
      # Deliberately slow: with our very subcooled feed (DA at 0.15 MPa), the
      # AB drum's feed->condensation->steam-volume coupling inverts the
      # short-term level response to feed changes (~2 min break-even), so an
      # aggressive trim destabilizes; feedforward carries the fast work.
      # 0.4.0 M4b retune (was kp 15 / ki 0.15, Ti 100 s): the AB drum's
      # SUSTAINED inverse gain kappa ~ 8.6 mm per kg/s of feed makes this loop
      # unstable iff Ti = kp/ki < kappa*rhoA ~ 116 s (rhoA ~ 13.5 t/m). The old
      # tuning had a ~1890 s mode at zeta ~ -0.02. Ti 400 s: ring-down zeta ~ 0.44
      # (scripts/level_mode_ringdown.py; HANDOFF 0.4.0 M4b).
      kp: 30.0
      ki: 0.075
      lo: -25.0
      hi: 25.0
      t_track: 10.0
    flow:                 # PV: sensed feed flow [kg/s]; output: fw valve cmd
      kp: 0.004
      ki: 0.02
      lo: 0.0
      hi: 1.0
      t_track: 5.0
  drum_pressure:          # PV: sensed drum pressure [Pa]; output: firing cmd
    kp: 1.8e-7
    ki: 3.0e-9
    lo: 0.0
    hi: 1.0
    t_track: 20.0
  hotwell_level:          # 0.4.0 M5b. PV: sensed hotwell level rel [m]; output: makeup valve
    # Setpoint below normal no-leak wander (quiet days: two_state +-14 mm, AB
    # -21..+244 mm), so it acts only on a loss (makeup-only: no reject path,
    # so a nominal setpoint would ratchet inventory up over load cycles).
    # Integrator plant ~1.26e-3 (m/s)/unit (10 kg/s / 7.9 t/m): ~60 s loop, Ti 300 s.
    setpoint: -0.15
    kp: 13.0
    ki: 0.044
    lo: 0.0
    hi: 1.0
    t_track: 15.0         # unused with conditional anti-windup
    anti_windup: conditional  # it normally sits closed; see control/pid.py
  da_level:               # PV: sensed DA level rel [m]; output: LCV position
    kp: 1.5
    ki: 0.025
    lo: 0.0
    hi: 1.0
    t_track: 15.0
